name: Fork image

# This fork's only workflow (every upstream workflow is disabled here; see FORK.md). On an oliviacpu-* tag it runs
# the plex-label-proxy tests, then builds Dockerfile.fork-proxy and pushes ghcr.io/oliviacpu/iptvtunerr:<tag> and :latest
# (the newest tag build, which the deployment runs, so a tag is a release).

on:
  push:
    tags:
      - "oliviacpu-*"
  workflow_dispatch: # run it by hand on an oliviacpu-* tag (pick the tag as the ref)

permissions:
  contents: read
  packages: write

# One tag build at a time, so the newest-tag check and the :latest retag below never race another build.
concurrency:
  group: fork-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'oliviacpu/iptvtunerr' && startsWith(github.ref, 'refs/tags/oliviacpu-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Proxy tests
        run: |
          docker run --rm -v "$PWD":/src -w /src -e GOFLAGS=-mod=vendor -e GOTOOLCHAIN=local golang:1.26.9 \
            go test ./internal/plexlabelproxy/ ./cmd/iptv-tunerr/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fork-proxy
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/iptvtunerr:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # The deployment runs :latest, so a tag is a release. It moves to this build only if the tag is still the newest
      # oliviacpu-* tag (version order) once the image is pushed, so an older tag's build, or a rerun of one, can't move
      # it back however the runs overlap.
      - name: Move latest
        run: |
          git fetch --quiet --force --tags origin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iptvtunerr"
          newest=$(git tag -l 'oliviacpu-*' --sort=-v:refname | head -n 1)
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is older than $newest, so :latest stays put"
            exit 0
          fi
          docker buildx imagetools create --tag "$image:latest" "$image:${GITHUB_REF_NAME}"
